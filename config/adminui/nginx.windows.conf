server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal resolver for dynamic DNS
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # Prevent caching upstream IPs
    set $upstream_adminms http://adminms:6780;
    set $upstream_corems http://corems:6980;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /springboot-crud-rest-adminms/ {
        proxy_pass $upstream_adminms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /springboot-crud-rest-admin/ {
        proxy_pass $upstream_corems;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /springboot-crud-rest-corems/ {
        proxy_pass $upstream_corems;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
